spring:
  application:
    name: payment-service
  cloud:
    service-registry:
      auto-registration:
        enabled: false
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none} # 운영에선 none 권장됨
    show-sql: ${SHOW_SQL:false} # 운영에선 로그 너무 많이 찍히니 false로 끄기 위해
    properties:
      hibernate:
        format_sql: true
        default_schema: payment_schema
        hbm2ddl:
          create_namespaces: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${PAYMENT_SERVER_PORT:8010}
  servlet:
    context-path: /api/v1/  # ALB가 넘겨주는 경로와 맞춰줍니다.

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}  # AWS에서는 false
    register-with-eureka: false
    fetch-registry: true

portone:
  secret:
    api: ${PORTONE_API_SECRET}
    store-id: ${PORTONE_STORE_ID}
    channel-key: ${PORTONE_CHANNEL_KEY}
    webhook: ${PORTONE_WEBHOOK}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    prometheus:
      access: unrestricted
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}

    zipkin:
      tracing:
        endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
