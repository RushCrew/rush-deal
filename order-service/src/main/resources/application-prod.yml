spring:
  application:
    name: order-service

  batch:
    jdbc:
      initialize-schema: never
      table-prefix: order_schema.BATCH_
    job:
      enabled: false

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: ${QUARTZ_INIT_SCHEMA:never}  # 환경변수로 제어   # Quartz 자동 초기화 사용
    properties:
      org:
        quartz:
          scheduler:
            instanceName: OrderScheduler
            instanceId: AUTO

          dataSource:
            main:
              driver: org.postgresql.Driver
              URL: ${DB_URL}
              user: ${DB_USERNAME}
              password: ${DB_PASSWORD}

          jobStore:
            class: org.quartz.impl.jdbcjobstore.JobStoreTX
            driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
            tablePrefix: quartz_schema.QRTZ_
            isClustered: true
            useProperties: false

          threadPool:
            threadCount: ${QUARTZ_THREAD_COUNT:10}

  data:
    redis:
      host: ${USER_REDIS_HOST:localhost}
      port: ${USER_REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none} # 운영에선 none이나 validate로 바꾸기 위해 변수 처리
    show-sql:  ${SHOW_SQL:false} # 운영에선 로그 너무 많이 찍히니 false로 끄기 위해
    properties:
      hibernate:
        format_sql: false
        default_schema: order_schema

  sql:
    init:
      mode: ${SQL_INIT_MODE:never} # 기본은 안 함. 로컬에서만 환경변수로 always 주입. 매번 초기화 스크립트 실행하는 문제 발생 (data.sql, schema.sql)
      encoding: UTF-8

  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
    listener:
      ack-mode: record # 메시지 단위로 commit
    retry:
      max-attempts: 3 # 최대 3번 재시도
      backoff:
        initial-interval: 1000 # 첫 재시도: 1초 후
        multiplier: 2.0 # 재시도 간격: 1초 → 2초 → 4초
        max-interval: 10000 # 최대 10초

server:
  port: ${ORDER_SERVER_PORT:8050}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}  # AWS에서는 false
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,scheduledtasks
      base-path: /actuator

  endpoint:
    health:
      show-details: always
    prometheus:
      access: unrestricted

  metrics:
    tags:
      application: ${spring.application.name}

  prometheus:
    metrics:
      export:
        enabled: true

  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}

    export:
      zipkin:
        enabled: ${ZIPKIN_ENABLED:false}
        endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
