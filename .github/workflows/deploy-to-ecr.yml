name: Deploy to Amazon ECR (Develop)

on:
  push:
    branches: [ "develop", "improve/infra/217" ] # develop 브랜치에 푸시(머지)될 때만 실행

  workflow_dispatch: # 수동 실행 버튼 추가
    inputs:
      service:
        description: 'Service to deploy (or "all" for all services)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - auth-service
          - user-service
          - order-service
          - payment-service
          - product-service
          - queue-service
          - timedeal-service

env:
  AWS_REGION: ap-northeast-2                  # 리전 (서울)
  ECR_REPOSITORY_PREFIX: rushdeal              # ECR 리포지토리 이름 접두사 (예: rushdeal-user-service)
  ECS_CLUSTER: rush_deal_msa

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # 하나가 실패해도 나머지는 계속 진행
      matrix:
        # 빌드할 서비스 목록 (폴더명과 일치해야 함)
        service:
          - auth-service
          - user-service
          - order-service
          - payment-service
          - product-service
          - queue-service
          - timedeal-service

    steps:
      # 1. 소스 코드 가져오기
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. JDK 21 설정 (Gradle 빌드용)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      # 3. Gradle 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Gradle 캐싱 추가 (빌드 속도 향상)
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4. AWS 자격 증명 설정 (Secrets에서 가져옴)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 5. Amazon ECR 로그인
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 6. 도커 이미지 빌드 및 푸시 (핵심!)
      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          # 이미지 태그: develop-커밋해시 (버전 관리용) + latest
          IMAGE_TAG: develop-${{ github.sha }}
        run: |
          # 서비스 이름 정의 (예: rushdeal-user-service)
          REPO_NAME="${{ env.ECR_REPOSITORY_PREFIX }}-${{ matrix.service }}"
          
          echo "Build & Push -> $REPO_NAME"
          
          # Docker 빌드
          # -f Dockerfile.template : 우리가 만든 템플릿 사용
          # --build-arg SERVICE_NAME : 템플릿에 서비스 이름 전달
          docker build -t $ECR_REGISTRY/$REPO_NAME:$IMAGE_TAG \
                       -t $ECR_REGISTRY/$REPO_NAME:latest \
                       -f Dockerfile.template \
                       --build-arg SERVICE_NAME=${{ matrix.service }} \
                       .
          
          # ECR로 푸시
          echo "Pushing $REPO_NAME:$IMAGE_TAG..."
          docker push $ECR_REGISTRY/$REPO_NAME:$IMAGE_TAG
          echo "Pushing $REPO_NAME:latest..."
          docker push $ECR_REGISTRY/$REPO_NAME:latest
          
          echo "--- Successfully pushed $REPO_NAME"

      # 7. ECS 서비스에 새로운 ERC 이미지 갱신 (# 예: user-service)
      - name: Update ECS Service with new image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: develop-${{ github.sha }}
        run: |
          REPO_NAME="${{ env.ECR_REPOSITORY_PREFIX }}-${{ matrix.service }}"
          SERVICE_NAME="${{ env.ECR_REPOSITORY_PREFIX }}-${{ matrix.service }}"
          
          echo "----Deploying $SERVICE_NAME to ECS Cluster: $CLUSTER_NAME----"
          
          # ECS 서비스 강제 재배포 (최신 이미지 사용)
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service $SERVICE_NAME \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}
          
          echo "---Deployment triggered for $SERVICE_NAME"
          echo "---Image: $ECR_REGISTRY/$REPO_NAME:$IMAGE_TAG"

      - name: Wait for deployment to complete
        run: |
          SERVICE_NAME="${{ matrix.service }}"
          
          echo "---Waiting for $SERVICE_NAME deployment to stabilize..."
          
          aws ecs wait services-stable \
                      --cluster ${{ env.ECS_CLUSTER }} \
                      --services $SERVICE_NAME \
                      --region ${{ env.AWS_REGION }}

                    echo "--- $SERVICE_NAME is now stable!"

      # 8. 빌드 결과 요약
      - name: Image digest
        run: |
          echo "Service: ${{ matrix.service }}"
          echo "Image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_PREFIX }}-${{ matrix.service }}:develop-${{ github.sha }}"

